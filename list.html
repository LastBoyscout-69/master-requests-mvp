<!DOCTYPE html>
<!-- DOCTYPE сообщает браузеру: это современный HTML-документ, рендерь его по стандартным правилам.
     Без этой строки браузеры впадают в «режим совместимости» и могут показывать страницу иначе. -->
<html>
<head>
  <!-- В head живёт служебная информация: кодировка, заголовок вкладки и стили. -->
  <meta charset="utf-8">
  <!-- charset="utf-8" — кодировка файла. Она нужна, чтобы русские буквы показывались,
       а не превращались в кракозябры вида «РЎРїРёСЃРѕРє». -->
  <title>Список заявок</title>
  <!-- title — то, что написано на вкладке браузера, а не на самой странице. -->

  <!-- Стили я держу прямо в теге <style> внутри страницы.
       Это простой способ для MVP: не нужен отдельный CSS-файл и не нужно его подключать.
       Если когда-нибудь стилей станет много — вынесу их в отдельный файл, а пока так удобнее.

       Пара слов о том, как читается CSS: каждый блок — это «селектор { свойство: значение; }».
       Селектор говорит, ЧЕГО касаемся, свойства в фигурных скобках — ЧТО с этим делаем.
       Комментарии внутри CSS пишутся так: /* вот так */, решётка # здесь не работает. -->
  <style>
    /* Таблица занимает всю ширину страницы.
       width: 100% — растянуть от левого края до правого.
       border-collapse: collapse — убираю двойные линии между ячейками,
       чтобы границы выглядели одной аккуратной сеткой, а не двойной жирной. */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    /* Ячейки: заголовки (th) и обычные ячейки (td) сразу.
       Запятая в селекторе означает «и то, и другое» — одно правило на оба тега.
       border — рамка в 1 пиксель, цвет #444 — тёмно-серый (почти чёрный, но мягче).
       padding — отступы внутри ячеек, чтобы текст не прилипал к краям.
       text-align: left — выравниваю текст по левому краю,
       потому что заголовки по умолчанию центрируются, и это выглядит неаккуратно. */
    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
    }

    /* Шапка выделена серым фоном, чтобы она читалась как заголовок таблицы. */
    th {
      background-color: #eee;
    }

    /* Ширина колонок.
       nth-child(1) — первая колонка (ID), nth-child(2) — вторая (Имя) и так далее.
       Правила лежат РЯДОМ с блоком th, а не внутри него: вложенные селекторы
       th:nth-child(...) внутри th { } читались бы как «th внутри th», а такого нет.
       Задаю ширину и th, и td — чтобы браузер точно применил её ко всей колонке.
       Сумма примерно 100%: седьмую колонку (кнопки) браузер добирает сам.
       Хочу другой расклад — просто меняю проценты и обновляю страницу. */
    /* Ширина колонок.
       nth-child(1) — первая колонка (ID), nth-child(2) — вторая (Имя) и так далее.
       Правила лежат РЯДОМ с блоком th, а не внутри него: вложенные селекторы
       th:nth-child(...) внутри th { } читались бы как «th внутри th», а такого нет.
       Задаю ширину и th, и td — чтобы браузер точно применил её ко всей колонке.
       Сумма примерно 100%: седьмую колонку (кнопки) браузер добирает сам. */
    th:nth-child(1), td:nth-child(1) { width: 5%; }   /* ID — узкая: там только номер заявки */
    th:nth-child(2), td:nth-child(2) { width: 12%; }  /* Имя — имя клиента из формы */
    th:nth-child(3), td:nth-child(3) { width: 15%; }  /* Телефон — контактный номер клиента */
    th:nth-child(4), td:nth-child(4) { width: 35%; }  /* Проблема — описание поломки, самый длинный текст, поэтому ей больше всех */
    th:nth-child(5), td:nth-child(5) { width: 10%; }  /* Статус — «Новая», «В работе» или «Готово», эта ячейка ещё и красится цветом */
    th:nth-child(6), td:nth-child(6) { width: 10%; }  /* Дата — когда заявку создали, база ставит её сама */
    /* Седьмая колонка (Сменить статус — кнопки «В работу» и «Готово») заберёт остаток ширины сама — это нормально */


    /* Цвета статусов.
       Как это устроено: в Python ячейке со статусом ставится два класса —
       всегда "status" и дополнительный по значению: new, in-work или done.
       Селектор .status.new читается так: «элемент с классом status И классом new»,
       то есть красится только ячейка статуса, а не вся строка таблицы.

       Цвета подобраны по смыслу: серый — ничего не делалось,
       жёлтый — работа идёт, зелёный — готово.
       Захочешь свои оттенки — меняй только код цвета после решётки. */
    .status.new {
      background-color: #f0f0f0;   /* светло-серый: новая, ещё не тронута */
    }
    .status.in-work {
      background-color: #fff3cd;   /* светло-жёлтый: работа в процессе */
    }
    .status.done {
      background-color: #d4edda;   /* светло-зелёный: готово */
    }
  </style>
</head>
<body>
  <!-- Всё, что видно на странице, лежит в body. -->

  <h1>Список заявок</h1>
  <!-- Ссылка обратно на главную страницу с формой. -->
  <p><a href="/">Новая заявка</a></p>

  <!-- Фильтр по статусу. Это обычные ссылки, никакого JavaScript.
       /list без параметра — все заявки,
       /list?status=Новая — только со статусом «Новая», и так далее.
       То, что после знака ?, называется query-параметрами:
       их читает сервер в обработчике /list через request.query_params.
       Ловушка, о которую легко споткнуться: на кнопке написано «Новые» (множественное число),
       а в базе статус хранится как «Новая» — строки должны совпадать точь-в-точь,
       иначе фильтр покажет пустую таблицу. -->
  <p>
    Фильтр по статусу:
    <a href="/list">Все</a> |
    <a href="/list?status=Новая">Новые</a> |
    <a href="/list?status=В работе">В работе</a> |
    <a href="/list?status=Готово">Готово</a>
  </p>

  <!-- Таблица заявок. Рамки и отступы задаёт CSS выше — атрибутов border и cellpadding
       в теге больше нет: смешивать оба способа не стоит, иначе не поймёшь, что откуда берётся. -->
  <table>
    <!-- Первая строка — шапка: th рисует текст жирным и попадает под серый фон из CSS. -->
    <tr>
      <th>ID</th>
      <th>Имя</th>
      <th>Телефон</th>
      <th>Проблема</th>
      <th>Статус</th>
      <th>Дата</th>
      <th>Сменить статус</th>
    </tr>
    <!-- REPEAT -->
    <!-- Сюда сервер вставляет строки заявок: в web_service.py функция show_list
         собирает в цикле HTML каждой строки и подменяет эту метку через .replace().
         Если заявок нет, на месте метки останется пусто — таблица будет просто с шапкой. -->
  </table>
</body>
</html>
